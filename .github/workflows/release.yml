name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux x86_64 release
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libsqlite3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify tag matches binary version
        shell: bash
        run: |
          set -euo pipefail
          expected="WhyRun ${GITHUB_REF_NAME#v}"
          actual="$(./build/whyrun --version)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match binary version: $actual" >&2
            exit 1
          fi

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          package="whyrun-${GITHUB_REF_NAME}-linux-x86_64"
          install -Dm755 build/whyrun "dist/$package/whyrun"
          install -Dm644 README.md LICENSE "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          cd dist
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "WhyRun $GITHUB_REF_NAME"
